name: Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'NSIS installation did not supply makensis.exe.' }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Build installer with public artwork
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'private-assets') { throw 'The public checkout contains private assets.' }
          npm run build:win
      - name: Verify the installed Windows app
        run: npm run smoke:win
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-player-windows-x64
          path: |
            dist/windows/public/DesktopPetPlayer-Setup-*-x64.exe
            dist/windows/public/DesktopPetPlayer-Setup-*-x64.exe.sha256
            dist/windows/public/smoke-results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-pet-player-windows-diagnostics
          path: |
            dist/windows/public/smoke-results.json
            dist/windows/public/smoke-diagnostics/
          if-no-files-found: ignore
